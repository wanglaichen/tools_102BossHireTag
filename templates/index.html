<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历投递公司标记</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ app_version }}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="hero-copy">
                <p class="eyebrow">Resume Delivery Tracker <span class="app-version" id="appVersion">{{ app_version }}</span></p>
                <h1>简历投递公司标记</h1>
                <p>配置交流状态和行业字典，记录投递结果、猎头、外包、面试状态，并支持双击直接编辑。</p>
            </div>
            <div class="metrics">
                <article>
                    <span>公司总数</span>
                    <strong id="companyCount">0</strong>
                </article>
                <article>
                    <span>已拒绝</span>
                    <strong id="rejectedCount">0</strong>
                </article>
                <article>
                    <span>猎头</span>
                    <strong id="hunterCount">0</strong>
                </article>
                <article>
                    <span>外包</span>
                    <strong id="outsourcedCount">0</strong>
                </article>
                <article>
                    <span>已面试</span>
                    <strong id="interviewedCount">0</strong>
                </article>
                <article>
                    <span>需跟进</span>
                    <strong id="followUpCount">0</strong>
                </article>
            </div>
        </header>

        <div class="proxy-bar" id="proxyBar">
            <span class="proxy-label">代理</span>
            <input type="checkbox" id="proxyEnableCheck" style="margin:0 4px;">
            <input id="proxyInput" class="form-control form-control-sm d-none" placeholder="http://127.0.0.1:7890" style="width:260px;">
            <button class="btn btn-sm btn-outline-primary d-none" id="saveProxyBtn">设置</button>
            <span class="proxy-status" id="proxyStatus"></span>
            <span class="vr-line"></span>
            <span class="proxy-label">创建时间</span>
            <button class="btn btn-sm btn-outline-secondary time-filter-btn" data-filter="all">所有</button>
            <button class="btn btn-sm btn-outline-secondary time-filter-btn" data-filter="today">今天</button>
            <button class="btn btn-sm btn-outline-secondary time-filter-btn" data-filter="yesterday">昨天</button>
            <button class="btn btn-sm btn-outline-secondary time-filter-btn" data-filter="before_yesterday">昨天及以前</button>
            <button class="btn btn-sm btn-outline-warning" id="fixHistoryBtn">修复历史数据</button>
            <button class="btn btn-sm btn-outline-success ms-auto" id="refreshCompaniesBtn">刷新列表</button>
            <span class="proxy-label" id="currentUserLabel"></span>
            <button class="btn btn-sm btn-outline-primary d-none" id="accountAdminBtn" type="button">账号管理</button>
            <button class="btn btn-sm btn-outline-secondary" id="logoutBtn" type="button">退出</button>
        </div>

        <div class="alert alert-danger d-none" id="errorBox"></div>
        <div class="alert alert-success d-none" id="successBox"></div>

        <main class="workspace">
            <div class="resize-handle" id="workspaceResizeHandle"></div>
            <section class="side-panel">
                <div class="panel-title">
                    <h2>新增记录</h2>
                    <span id="lastUpdatedAt">-</span>
                </div>
                <form id="companyForm" class="record-form">
                    <label>
                        <span>企业名称</span>
                        <input id="companyNameInput" class="form-control" autocomplete="off" required>
                    </label>
                    <label>
                        <span>交流状态</span>
                        <select id="effectStatusInput" class="form-select">
                            <option value="">请选择交流状态</option>
                        </select>
                    </label>
                    <label>
                        <span>行业</span>
                        <select id="industryInput" class="form-select">
                            <option value="">请选择行业</option>
                        </select>
                    </label>
                    <div class="grid-two">
                        <label>
                            <span>是否是猎头</span>
                            <select id="hunterInput" class="form-select">
                                <option value="unknown">未标记</option>
                                <option value="yes">是</option>
                                <option value="no">否</option>
                            </select>
                        </label>
                        <label>
                            <span>是否是外包</span>
                            <select id="outsourcedInput" class="form-select">
                                <option value="unknown">未标记</option>
                                <option value="yes">是</option>
                                <option value="no">否</option>
                            </select>
                        </label>
                    </div>
                    <label>
                        <span>是否已面试</span>
                        <select id="interviewedInput" class="form-select">
                            <option value="unknown">未标记</option>
                            <option value="yes">是</option>
                            <option value="no">否</option>
                        </select>
                    </label>
                    <label>
                        <span>备注</span>
                        <textarea id="noteInput" class="form-control" rows="3" placeholder="联系人、渠道、下一步动作"></textarea>
                    </label>
                    <button class="btn btn-primary w-100" id="submitButton" type="submit">保存记录</button>
                    <button class="btn btn-outline-secondary w-100 d-none" id="cancelEditButton" type="button">取消编辑</button>
                </form>

                <div class="import-box">
                    <div class="panel-title compact">
                        <h2>批量粘贴</h2>
                    </div>
                    <textarea id="bulkImportInput" class="form-control" rows="7" placeholder="从 Excel 复制表格行，列顺序：企业名称、交流状态、行业、是否是猎头、是否是外包、是否已面试、备注"></textarea>
                    <button class="btn btn-outline-primary w-100" id="importButton" type="button">导入 / 更新</button>
                </div>

                <div class="config-box">
                    <div class="panel-title compact">
                        <h2>可配置选项</h2>
                        <span>变更后直接写入 Redis</span>
                    </div>
                    <div class="config-section">
                        <div class="config-head">
                            <span>交流状态</span>
                            <small>用于表单提示和筛选</small>
                        </div>
                        <div class="config-input-row">
                            <input id="newStatusInput" class="form-control" placeholder="添加新的状态类型">
                            <button class="btn btn-outline-primary" id="addStatusButton" type="button">添加</button>
                        </div>
                        <div id="statusChips" class="chip-list"></div>
                    </div>
                    <div class="config-section">
                        <div class="config-head">
                            <span>行业</span>
                            <small>用于表单提示和筛选</small>
                        </div>
                        <div class="config-input-row">
                            <input id="newIndustryInput" class="form-control" placeholder="添加新的行业类型">
                            <button class="btn btn-outline-primary" id="addIndustryButton" type="button">添加</button>
                        </div>
                        <div id="industryChips" class="chip-list"></div>
                    </div>
                </div>
            </section>

            <section class="table-panel">
                <div class="tools">
                    <div class="search-group">
                        <input id="searchInput" class="form-control" placeholder="搜索公司、状态、行业、备注">
                        <div class="multi-filter-dropdown" id="statusDropdown">
                            <button type="button" class="btn btn-outline-secondary form-select" id="statusFilterBtn">
                                <span>全部状态</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="multi-filter-menu" id="statusFilterMenu"></div>
                        </div>
                        <select id="hunterFilter" class="form-select">
                            <option value="">全部类型</option>
                            <option value="yes">猎头</option>
                            <option value="no">非猎头</option>
                            <option value="unknown">未标记</option>
                        </select>
                        <select id="outsourcedFilter" class="form-select">
                            <option value="">全部外包</option>
                            <option value="yes">外包</option>
                            <option value="no">非外包</option>
                            <option value="unknown">未标记</option>
                        </select>
                    </div>
                    <div class="action-group">
                        <button class="btn btn-outline-primary" id="backupBtn" type="button">下载备份</button>
                        <button class="btn btn-outline-primary" id="importDataBtn">导入备份</button>
                        <button class="btn btn-outline-danger" id="importOverwriteBtn">导入并覆盖</button>
                        <button class="btn btn-outline-secondary" id="exportCsvBtn" type="button">导出 CSV</button>
                    </div>
                    <input type="file" id="importFileInput" accept=".json,.csv" class="d-none">
                </div>
                <div class="table-wrap">
                    <table class="table align-middle mb-0 resizable" id="companyTable">
                        <thead>
                            <tr>
                                <th draggable="true" data-col="company_name">企业名称</th>
                                <th draggable="true" data-col="actions">操作</th>
                                <th draggable="true" data-col="effect_status">
                                    <span class="col-head-with-hint">
                                        <span>状态</span>
                                        <button type="button" class="col-hint-dot" data-tip="交流状态&#10;是否已面试" aria-label="列说明"></button>
                                    </span>
                                </th>
                                <th draggable="true" data-col="industry">行业</th>
                                <th draggable="true" data-col="is_hunter">
                                    <span class="col-head-with-hint">
                                        <span>猎头/外包</span>
                                        <button type="button" class="col-hint-dot" data-tip="是否是猎头&#10;是否是外包" aria-label="列说明"></button>
                                    </span>
                                </th>
                                <th draggable="true" data-col="note">备注</th>
                                <th draggable="true" data-col="updated_at">更新时间</th>
                            </tr>
                        </thead>
                        <tbody id="companyTableBody">
                            <tr><td colspan="7" class="empty-cell">暂无记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="loginGate" class="login-gate">
        <form id="loginForm" class="login-card">
            <h2>登录</h2>
            <p class="login-tip">每个账号的公司记录互相独立。默认管理员来自服务器配置。</p>
            <label>用户名<input id="loginUsername" class="form-control" autocomplete="username" required></label>
            <label>密码<input id="loginPassword" class="form-control" type="password" autocomplete="current-password" required></label>
            <button class="btn btn-primary w-100" type="submit">登录</button>
            <button class="btn btn-outline-secondary w-100" id="showRegisterBtn" type="button">注册新账号</button>
            <div id="loginError" class="login-error"></div>
        </form>
        <form id="registerForm" class="login-card d-none">
            <h2>注册</h2>
            <label>用户名<input id="registerUsername" class="form-control" autocomplete="username" required></label>
            <label>显示名<input id="registerDisplayName" class="form-control" autocomplete="nickname"></label>
            <label>密码<input id="registerPassword" class="form-control" type="password" autocomplete="new-password" required></label>
            <button class="btn btn-primary w-100" type="submit">注册并登录</button>
            <button class="btn btn-outline-secondary w-100" id="showLoginBtn" type="button">返回登录</button>
            <div id="registerError" class="login-error"></div>
        </form>
    </div>

    <div id="accountAdmin" class="account-admin d-none">
        <div class="login-card account-card">
            <div class="account-head">
                <h2>账号管理</h2>
                <button class="btn btn-sm btn-outline-secondary" id="closeAccountAdminBtn" type="button">关闭</button>
            </div>
            <form id="createAccountForm" class="account-create">
                <input id="newAccountUsername" class="form-control" placeholder="用户名" required>
                <input id="newAccountDisplayName" class="form-control" placeholder="显示名">
                <input id="newAccountPassword" class="form-control" type="password" placeholder="密码" required>
                <select id="newAccountRole" class="form-select">
                    <option value="user">普通账号</option>
                    <option value="admin">管理员</option>
                </select>
                <button class="btn btn-primary" type="submit">创建</button>
            </form>
            <div id="accountAdminError" class="login-error"></div>
            <div class="table-wrap">
                <table class="table table-sm align-middle">
                    <thead>
                        <tr><th>用户名</th><th>显示名</th><th>角色</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="accountTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ app_version }}"></script>
</body>
</html>
